name: Deploy Cashflow Backend to Biznet VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Sync Code and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /var/www/cashflow-backend
            git reset --hard
            git pull origin main
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            sudo chown -R rancangsistem:rancangsistem /var/www/cashflow-backend
            sudo chmod -R 775 /var/www/cashflow-backend/storage /var/www/cashflow-backend/bootstrap/cache
            sudo systemctl reload nginx
            sudo systemctl reload php8.4-fpm
